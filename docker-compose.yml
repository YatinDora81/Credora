services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credora
      POSTGRES_PASSWORD: credora
      POSTGRES_DB: credora
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credora -d credora"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: prisma }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    command: sh -c "cd packages/db && npx prisma migrate deploy"
    restart: "no"

  mock-upstream:
    build: { context: ., dockerfile: docker/mock-upstream.Dockerfile }
    ports: ["4000:4000"]
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    ports: ["3000:3000"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    command: sh -c "bun run packages/db/src/seed.ts && bun run apps/api/src/server.ts"

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }
      mock-upstream: { condition: service_started }
    ports: ["4100:4100"]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
    command: bun run apps/worker/src/main.ts

volumes: { pgdata: {} }
